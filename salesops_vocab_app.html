<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>セールスオップス 韓国語単語帳</title>
<meta name="theme-color" content="#0d0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="韓国語単語帳">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0d0f14; --bg2:#161922; --bg3:#1e2230;
  --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.14);
  --text:#e8eaf0; --text2:#8b90a0; --text3:#555a6e;
  --accent:#4f8ef7; --accent2:#6ee7b7; --accent3:#f7c948;
  --danger:#f76f6f; --success:#4fd18a;
  --sf:#00a1e0; --rev:#4fd18a; --ops:#b794f4; --ptc:#f7a035;
  --font:'Noto Sans JP','Noto Sans KR',sans-serif;
  --mono:'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;display:flex;flex-direction:column}
header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg2)}
.logo{font-family:var(--mono);font-size:13px;color:var(--accent);letter-spacing:.12em}
.logo span{color:var(--text2)}
.nav-tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto}
.nav-tab{padding:10px 14px;font-size:13px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s;flex-shrink:0}
.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
main{flex:1;padding:20px;max-width:720px;margin:0 auto;width:100%}
.screen{display:none}.screen.active{display:block}

/* controls */
.controls{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.ctrl-label{font-size:12px;color:var(--text2)}
.ctrl-group{display:flex;gap:4px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:4px}
.ctrl-btn{padding:5px 12px;font-size:12px;border-radius:5px;border:none;cursor:pointer;background:transparent;color:var(--text2);font-family:var(--font);transition:all .15s}
.ctrl-btn.active{background:var(--accent);color:#fff}

/* cat filter */
.cat-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.cat-btn{padding:4px 12px;border-radius:20px;border:1px solid var(--border2);background:transparent;font-size:12px;cursor:pointer;font-family:var(--font);color:var(--text2);transition:all .15s}
.cat-btn.on-sf{background:rgba(0,161,224,.15);border-color:var(--sf);color:var(--sf)}
.cat-btn.on-rev{background:rgba(79,209,138,.15);border-color:var(--rev);color:var(--rev)}
.cat-btn.on-ops{background:rgba(183,148,244,.15);border-color:var(--ops);color:var(--ops)}
.cat-btn.on-ptc{background:rgba(247,160,53,.15);border-color:var(--ptc);color:var(--ptc)}

/* scores */
.score-row{display:flex;gap:10px;margin-bottom:16px}
.score-badge{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.score-num{font-size:24px;font-weight:700;font-family:var(--mono)}
.score-label{font-size:11px;color:var(--text2);margin-top:2px}
.score-badge.s-total .score-num{color:var(--accent3)}
.score-badge.s-ok .score-num{color:var(--success)}
.score-badge.s-ng .score-num{color:var(--danger)}

/* progress */
.prog-wrap{margin-bottom:16px}
.prog-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:6px}
.prog-bar{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .4s}

/* flashcard */
.card-wrap{perspective:1000px;width:100%;height:200px;margin-bottom:16px;cursor:pointer}
.card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:1px solid var(--border2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:6px}
.card-front{background:var(--bg2)}
.card-back{background:var(--bg3);transform:rotateY(180deg)}
.card-hint{position:absolute;top:10px;right:12px;font-size:11px;color:var(--text3);font-family:var(--mono)}
.card-tag{position:absolute;top:10px;left:12px;font-size:10px;padding:2px 8px;border-radius:10px;font-family:var(--mono)}
.tag-sf{background:rgba(0,161,224,.15);color:var(--sf)}
.tag-rev{background:rgba(79,209,138,.15);color:var(--rev)}
.tag-ops{background:rgba(183,148,244,.15);color:var(--ops)}
.tag-ptc{background:rgba(247,160,53,.15);color:var(--ptc)}
.card-word{font-size:26px;font-weight:500;text-align:center;line-height:1.3}
.card-sub{font-size:13px;color:var(--text2);text-align:center}
.card-en{font-family:var(--mono);font-size:11px;color:var(--text3)}
.tts-btn{background:none;border:1px solid var(--border2);border-radius:50%;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:15px;transition:all .15s;flex-shrink:0}
.tts-btn:hover,.tts-btn.speaking{color:var(--accent2);border-color:var(--accent2);background:rgba(110,231,183,.1)}

/* judge btns */
.judge-row{display:flex;gap:12px;margin-bottom:12px}
.btn{flex:1;padding:12px;border-radius:10px;border:none;font-size:14px;font-family:var(--font);cursor:pointer;font-weight:500;transition:all .15s}
.btn-ok{background:rgba(79,209,138,.15);color:var(--success);border:1px solid rgba(79,209,138,.3)}
.btn-ng{background:rgba(247,111,111,.12);color:var(--danger);border:1px solid rgba(247,111,111,.3)}
.btn-next{background:var(--accent);color:#fff;border:1px solid transparent}
.btn-sec{padding:9px 18px;border-radius:8px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:13px;font-family:var(--font);cursor:pointer;transition:all .15s}
.btn-center{text-align:center;margin-top:4px}
.feedback{text-align:center;font-size:14px;height:20px;margin-bottom:8px;font-weight:500}
.feedback.ok{color:var(--success)}.feedback.ng{color:var(--danger)}

/* quiz */
.quiz-q{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:24px 20px;text-align:center;margin-bottom:16px}
.quiz-qlabel{font-size:11px;color:var(--text3);font-family:var(--mono);margin-bottom:10px;letter-spacing:.08em}
.quiz-qword{font-size:28px;font-weight:500;margin-bottom:4px}
.quiz-qen{font-size:11px;color:var(--text3);font-family:var(--mono);margin-bottom:10px}
.quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.quiz-opt{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:13px 10px;font-size:14px;cursor:pointer;font-family:var(--font);color:var(--text);text-align:center;transition:all .15s;line-height:1.4}
.quiz-opt:hover:not(:disabled){border-color:var(--accent);background:rgba(79,142,247,.08)}
.quiz-opt.opt-ok{background:rgba(79,209,138,.15);border-color:var(--success);color:var(--success)}
.quiz-opt.opt-ng{background:rgba(247,111,111,.12);border-color:var(--danger);color:var(--danger)}

/* word list */
.word-list{display:flex;flex-direction:column;gap:6px}
.word-hdr{display:grid;grid-template-columns:1fr 1fr 1fr 60px;gap:8px;padding:4px 12px;font-size:11px;color:var(--text3);font-family:var(--mono)}
.word-row{display:grid;grid-template-columns:1fr 1fr 1fr 60px;gap:8px;align-items:center;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:13px}
.word-row.weak{border-left:3px solid var(--danger)}
.dot{display:inline-block;width:6px;height:6px;border-radius:3px;margin-right:4px;vertical-align:middle}
.dot-sf{background:var(--sf)}.dot-rev{background:var(--rev)}.dot-ops{background:var(--ops)}.dot-ptc{background:var(--ptc)}
.stat-ok{color:var(--success);font-family:var(--mono);font-size:11px}
.stat-ng{color:var(--danger);font-family:var(--mono);font-size:11px}

/* finish */
.finish{background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:36px 28px;text-align:center;display:none}
.finish-icon{font-size:44px;margin-bottom:14px}
.finish-title{font-size:20px;font-weight:700;margin-bottom:6px}
.finish-sub{font-size:14px;color:var(--text2);margin-bottom:24px}
.finish-stats{display:flex;gap:14px;justify-content:center;margin-bottom:24px}
.finish-stat{background:var(--bg3);border-radius:12px;padding:14px 20px;min-width:90px}
.finish-stat .n{font-size:26px;font-weight:700;font-family:var(--mono)}
.finish-stat .l{font-size:11px;color:var(--text2);margin-top:2px}
.finish-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* phrases */
.phrase-search{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--text);font-family:var(--font);outline:none;margin-bottom:14px}
.phrase-search::placeholder{color:var(--text3)}
.phrase-group{font-size:11px;font-family:var(--mono);color:var(--text3);letter-spacing:.08em;padding:10px 0 6px;border-bottom:1px solid var(--border);margin-bottom:8px}
.phrase-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:8px}
.phrase-jp{font-size:13px;color:var(--text2);margin-bottom:5px;line-height:1.5}
.phrase-kr{font-size:16px;font-weight:500;line-height:1.5;margin-bottom:3px}
.phrase-en{font-size:11px;color:var(--text3);font-family:var(--mono);margin-bottom:10px}
.phrase-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copy-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:7px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:12px;font-family:var(--font);cursor:pointer;transition:all .15s}
.copy-btn:hover{background:var(--bg3);color:var(--accent2);border-color:var(--accent2)}
.copy-btn.copied{color:var(--success);border-color:var(--success)}
.del-btn{margin-left:auto;background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;padding:4px 6px;border-radius:6px;transition:all .15s}
.del-btn:hover{color:var(--danger)}
.add-card{background:var(--bg2);border:1px dashed var(--border2);border-radius:14px;padding:16px;margin-top:20px}
.add-title{font-size:13px;font-weight:500;color:var(--accent);margin-bottom:12px}
.add-fields{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.field-label{font-size:11px;color:var(--text3);font-family:var(--mono);margin-bottom:3px}
.phrase-input{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14px;color:var(--text);font-family:var(--font);outline:none;width:100%}
.pcat-row{display:flex;gap:6px;flex-wrap:wrap}
.pcat-btn{padding:4px 10px;border-radius:20px;border:1px solid var(--border2);background:transparent;font-size:12px;cursor:pointer;font-family:var(--font);color:var(--text2);transition:all .15s}
.pcat-btn.active{background:rgba(79,142,247,.15);border-color:var(--accent);color:var(--accent)}
.add-err{font-size:12px;color:var(--danger);margin-top:6px;min-height:16px}

.empty{text-align:center;padding:32px;color:var(--text2);font-size:14px}
@media(max-width:480px){.quiz-opts{grid-template-columns:1fr}.word-hdr,.word-row{grid-template-columns:1fr 1fr 60px}.word-hdr span:nth-child(3),.word-row span:nth-child(3){display:none}}
</style>
</head>
<body>
<header>
  <div class="logo">SALES<span>OPS</span> 単語帳</div>
  <div style="font-size:11px;color:var(--text3);font-family:var(--mono)">JP⇄KR</div>
</header>
<div class="nav-tabs">
  <div class="nav-tab active" onclick="showTab('flash')">🃏 フラッシュカード</div>
  <div class="nav-tab" onclick="showTab('quiz')">🎯 4択クイズ</div>
  <div class="nav-tab" onclick="showTab('words')">📋 単語リスト</div>
  <div class="nav-tab" onclick="showTab('phrases')">💬 フレーズ集</div>
</div>
<main>

<!-- FLASH -->
<div class="screen active" id="tab-flash">
  <div class="controls">
    <span class="ctrl-label">方向</span>
    <div class="ctrl-group">
      <button class="ctrl-btn active" id="f-btn-jp2kr" onclick="setFlashDir('jp2kr')">日→韓</button>
      <button class="ctrl-btn" id="f-btn-kr2jp" onclick="setFlashDir('kr2jp')">韓→日</button>
    </div>
    <button class="ctrl-btn" id="f-weak-btn" onclick="toggleFlashWeak()">苦手優先</button>
  </div>
  <div class="cat-filter">
    <button class="cat-btn on-sf" id="fcb-sf" onclick="toggleFlashCat('sf')"><span class="dot dot-sf"></span>Salesforce</button>
    <button class="cat-btn on-rev" id="fcb-rev" onclick="toggleFlashCat('rev')"><span class="dot dot-rev"></span>売上・利益</button>
    <button class="cat-btn on-ops" id="fcb-ops" onclick="toggleFlashCat('ops')"><span class="dot dot-ops"></span>セールスOps</button>
    <button class="cat-btn on-ptc" id="fcb-ptc" onclick="toggleFlashCat('ptc')"><span class="dot dot-ptc"></span>PTC用語</button>
  </div>
  <div class="score-row">
    <div class="score-badge s-total"><div class="score-num" id="f-total">0</div><div class="score-label">総問数</div></div>
    <div class="score-badge s-ok"><div class="score-num" id="f-ok">0</div><div class="score-label">正解</div></div>
    <div class="score-badge s-ng"><div class="score-num" id="f-ng">0</div><div class="score-label">不正解</div></div>
  </div>
  <div class="prog-wrap">
    <div class="prog-meta"><span id="f-prog">0 / 0</span><span id="f-pct">0%</span></div>
    <div class="prog-bar"><div class="prog-fill" id="f-bar" style="width:0%"></div></div>
  </div>
  <div id="f-game">
    <div class="card-wrap" onclick="flipCard()">
      <div class="card-inner" id="f-card">
        <div class="card-face card-front">
          <span class="card-tag" id="f-tag"></span>
          <span class="card-hint">タップして裏返す</span>
          <div class="card-word" id="f-front"></div>
          <div class="card-en" id="f-front-en"></div>
          <div style="margin-top:6px;display:none" id="f-front-tts">
            <button class="tts-btn" id="tts-f-front" onclick="event.stopPropagation();ttsPlay(currentWord.kr,'tts-f-front')">🔊</button>
          </div>
        </div>
        <div class="card-face card-back">
          <span class="card-hint">✓ 正解を確認</span>
          <div class="card-word" id="f-back"></div>
          <div class="card-sub" id="f-back-sub"></div>
          <div class="card-en" id="f-back-en"></div>
          <div style="margin-top:6px">
            <button class="tts-btn" id="tts-f-back" onclick="event.stopPropagation();ttsPlay(currentWord.kr,'tts-f-back')">🔊</button>
          </div>
        </div>
      </div>
    </div>
    <div class="feedback" id="f-fb"></div>
    <div class="judge-row" id="f-judge" style="display:none">
      <button class="btn btn-ng" onclick="judgeCard(false)">✗ 不正解</button>
      <button class="btn btn-ok" onclick="judgeCard(true)">✓ 正解</button>
    </div>
    <div class="btn-center" id="f-next" style="display:none">
      <button class="btn btn-next" style="width:180px" onclick="nextFlash()">次へ →</button>
    </div>
  </div>
  <div class="finish" id="f-finish">
    <div class="finish-icon">🎉</div>
    <div class="finish-title">ラウンド完了！</div>
    <div class="finish-sub" id="f-finish-sub"></div>
    <div class="finish-stats" id="f-finish-stats"></div>
    <div class="finish-btns">
      <button class="btn btn-next" style="padding:10px 24px" onclick="restartFlash(false)">もう一度</button>
      <button class="btn-sec" onclick="restartFlash(true)">苦手だけ</button>
    </div>
  </div>
</div>

<!-- QUIZ -->
<div class="screen" id="tab-quiz">
  <div class="controls">
    <span class="ctrl-label">方向</span>
    <div class="ctrl-group">
      <button class="ctrl-btn active" id="q-btn-jp2kr" onclick="setQuizDir('jp2kr')">日→韓</button>
      <button class="ctrl-btn" id="q-btn-kr2jp" onclick="setQuizDir('kr2jp')">韓→日</button>
    </div>
    <button class="ctrl-btn" id="q-weak-btn" onclick="toggleQuizWeak()">苦手優先</button>
  </div>
  <div class="cat-filter">
    <button class="cat-btn on-sf" id="qcb-sf" onclick="toggleQuizCat('sf')"><span class="dot dot-sf"></span>Salesforce</button>
    <button class="cat-btn on-rev" id="qcb-rev" onclick="toggleQuizCat('rev')"><span class="dot dot-rev"></span>売上・利益</button>
    <button class="cat-btn on-ops" id="qcb-ops" onclick="toggleQuizCat('ops')"><span class="dot dot-ops"></span>セールスOps</button>
    <button class="cat-btn on-ptc" id="qcb-ptc" onclick="toggleQuizCat('ptc')"><span class="dot dot-ptc"></span>PTC用語</button>
  </div>
  <div class="score-row">
    <div class="score-badge s-total"><div class="score-num" id="q-total">0</div><div class="score-label">総問数</div></div>
    <div class="score-badge s-ok"><div class="score-num" id="q-ok">0</div><div class="score-label">正解</div></div>
    <div class="score-badge s-ng"><div class="score-num" id="q-ng">0</div><div class="score-label">不正解</div></div>
  </div>
  <div class="prog-wrap">
    <div class="prog-meta"><span id="q-prog">0 / 0</span><span id="q-pct">0%</span></div>
    <div class="prog-bar"><div class="prog-fill" id="q-bar" style="width:0%"></div></div>
  </div>
  <div id="q-game">
    <div class="quiz-q">
      <div class="quiz-qlabel" id="q-label"></div>
      <div class="quiz-qword" id="q-word"></div>
      <div class="quiz-qen" id="q-en"></div>
      <button class="tts-btn" id="tts-q" onclick="ttsPlay(currentQuizKr,'tts-q')" style="margin-top:8px">🔊</button>
    </div>
    <div class="quiz-opts" id="q-opts"></div>
    <div class="feedback" id="q-fb"></div>
    <div class="btn-center">
      <button class="btn btn-next" id="q-next" style="width:180px;display:none" onclick="nextQuiz()">次へ →</button>
    </div>
  </div>
  <div class="finish" id="q-finish">
    <div class="finish-icon">🏆</div>
    <div class="finish-title">クイズ完了！</div>
    <div class="finish-sub" id="q-finish-sub"></div>
    <div class="finish-stats" id="q-finish-stats"></div>
    <div class="finish-btns">
      <button class="btn btn-next" style="padding:10px 24px" onclick="restartQuiz(false)">もう一度</button>
      <button class="btn-sec" onclick="restartQuiz(true)">苦手だけ</button>
    </div>
  </div>
</div>

<!-- WORDS -->
<div class="screen" id="tab-words">
  <div class="cat-filter">
    <button class="cat-btn on-sf" id="wcb-sf" onclick="toggleWordCat('sf')"><span class="dot dot-sf"></span>Salesforce</button>
    <button class="cat-btn on-rev" id="wcb-rev" onclick="toggleWordCat('rev')"><span class="dot dot-rev"></span>売上・利益</button>
    <button class="cat-btn on-ops" id="wcb-ops" onclick="toggleWordCat('ops')"><span class="dot dot-ops"></span>セールスOps</button>
    <button class="cat-btn on-ptc" id="wcb-ptc" onclick="toggleWordCat('ptc')"><span class="dot dot-ptc"></span>PTC用語</button>
  </div>
  <div class="word-list">
    <div class="word-hdr"><span>日本語</span><span>한국어</span><span>English</span><span>正誤</span></div>
    <div id="word-body"></div>
  </div>
</div>

<!-- PHRASES -->
<div class="screen" id="tab-phrases">
  <div class="cat-filter" id="ph-cats"></div>
  <input type="text" class="phrase-search" id="ph-search" placeholder="🔍 検索…" oninput="renderPhrases()">
  <div id="ph-list"></div>
  <div class="add-card">
    <div class="add-title">＋ 新しいフレーズを追加</div>
    <div class="add-fields">
      <div><div class="field-label">🇯🇵 日本語</div><input id="add-jp" class="phrase-input" placeholder="例：今週のフォーキャストを更新してください"></div>

function saveStats(){ try{localStorage.setItem('so_stats',JSON.stringify(stats));}catch(e){} }
function savePhrases(){ try{localStorage.setItem('so_phrases',JSON.stringify(userPhrases));}catch(e){} }
function getStat(i){ return stats[i]||{ok:0,ng:0}; }
function addStat(i,ok){ if(!stats[i])stats[i]={ok:0,ng:0}; ok?stats[i].ok++:stats[i].ng++; saveStats(); }
function isWeak(i){ var s=getStat(i); return s.ng>s.ok&&(s.ok+s.ng)>0; }

function shuffle(a){
  var b=a.slice(),i,j,t;
  for(i=b.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=b[i];b[i]=b[j];b[j]=t;}
  return b;
}

function getDeck(cats,weak){
  var pool=[];
  for(var i=0;i<WORDS.length;i++){
    if(cats[WORDS[i].cat]) pool.push(i);
  }
  if(weak){
    var wp=[];
    for(var j=0;j<pool.length;j++){ if(isWeak(pool[j])) wp.push(pool[j]); }
    if(wp.length>0) pool=wp;
  }
  return shuffle(pool);
}

function getOpts(correctKr, correctJp, dir){
  var correct = dir==='jp2kr'?correctKr:correctJp;
  var pool=[];
  for(var i=0;i<WORDS.length;i++){
    var v = dir==='jp2kr'?WORDS[i].kr:WORDS[i].jp;
    if(v!==correct) pool.push(v);
  }
  pool=shuffle(pool).slice(0,3);
  pool.push(correct);
  return shuffle(pool);
}

var krVoice=null;
function initTTS(){
  if(!window.speechSynthesis) return;
  function load(){ var vs=speechSynthesis.getVoices(); for(var i=0;i<vs.length;i++){ if(vs[i].lang.indexOf('ko')===0){krVoice=vs[i];break;} } }
  load(); speechSynthesis.onvoiceschanged=load;
}
function ttsPlay(text,btnId){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);
  u.lang='ko-KR'; u.rate=0.85;
  if(krVoice) u.voice=krVoice;
  var btn=document.getElementById(btnId);
  if(btn) btn.classList.add('speaking');
  u.onend=function(){ if(btn) btn.classList.remove('speaking'); };
  u.onerror=function(){ if(btn) btn.classList.remove('speaking'); };
  speechSynthesis.speak(u);
}

function judgeCard(ok){

  var pct=(fOk+fNg)>0?Math.round(fOk/(fOk+fNg)*100):0;
  document.getElementById('f-finish-sub').textContent='正答率 '+pct+'%';
  document.getElementById('f-finish-stats').innerHTML=
    '<div class="finish-stat"><div class="n" style="color:var(--accent3)">'+fDeck.length+'</div><div class="l">総問数</div></div>'+
    '<div class="finish-stat"><div class="n" style="color:var(--success)">'+fOk+'</div><div class="l">正解</div></div>'+
    '<div class="finish-stat"><div class="n" style="color:var(--danger)">'+fNg+'</div><div class="l">不正解</div></div>';
}
function restartFlash(weakOnly){
  if(weakOnly){ fWeak=true; document.getElementById('f-weak-btn').classList.add('active'); }
  startFlash();
}

// ===================== QUIZ =====================
function setQuizDir(d){
  qDir=d;
  document.getElementById('q-btn-jp2kr').classList.toggle('active',d==='jp2kr');
  document.getElementById('q-btn-kr2jp').classList.toggle('active',d==='kr2jp');
  startQuiz();
}
function toggleQuizWeak(){
  qWeak=!qWeak;
  document.getElementById('q-weak-btn').classList.toggle('active',qWeak);
  startQuiz();
}
function toggleQuizCat(cat){
  var on=Object.keys(qCats).filter(function(k){return qCats[k];}).length;
  if(qCats[cat]&&on>1) qCats[cat]=false;
  else qCats[cat]=true;
  var btn=document.getElementById('qcb-'+cat);
  btn.className='cat-btn'+(qCats[cat]?' on-'+cat:'');
  startQuiz();
}
function startQuiz(){
  qDeck=getDeck(qCats,qWeak); qIdx=0; qOk=0; qNg=0;
  document.getElementById('q-finish').style.display='none';
  document.getElementById('q-game').style.display='block';
  showQuiz();
}
function showQuiz(){
  updateQuizScore();
  if(qDeck.length===0){
    document.getElementById('q-word').textContent='単語がありません';
    document.getElementById('q-label').textContent='';
    document.getElementById('q-en').textContent='';
    document.getElementById('q-opts').innerHTML='';
    document.getElementById('q-next').style.display='none';
    return;
  }
  if(qIdx>=qDeck.length){ showQuizFinish(); return; }
  var idx=qDeck[qIdx];
  var w=WORDS[idx];
  currentQuizKr=w.kr;
  document.getElementById('q-next').style.display='none';
  document.getElementById('q-fb').textContent='';
  document.getElementById('q-fb').className='feedback';
  if(qDir==='jp2kr'){
    document.getElementById('q-label').textContent='日本語 → 韓国語';
    document.getElementById('q-word').textContent=w.jp;
  } else {
    document.getElementById('q-label').textContent='韓国語 → 日本語';
    document.getElementById('q-word').textContent=w.kr;
    if(window.speechSynthesis) setTimeout(function(){ttsPlay(w.kr,'tts-q');},300);
  }
  document.getElementById('q-en').textContent=w.en;
  var correct=qDir==='jp2kr'?w.kr:w.jp;
  var opts=getOpts(w.kr,w.jp,qDir);
  var container=document.getElementById('q-opts');
  container.innerHTML='';
  for(var i=0;i<opts.length;i++){
    var btn=document.createElement('button');
    btn.className='quiz-opt';
    btn.textContent=opts[i];
    (function(b,o,c,wi){ b.onclick=function(){ answerQuiz(b,o,c,wi); }; })(btn,opts[i],correct,idx);
    container.appendChild(btn);
  }
}
function answerQuiz(btn,chosen,correct,idx){
  var opts=document.querySelectorAll('.quiz-opt');
  for(var i=0;i<opts.length;i++) opts[i].disabled=true;
  var ok=chosen===correct;
  addStat(idx,ok);
  if(ok) qOk++; else qNg++;
  btn.classList.add(ok?'opt-ok':'opt-ng');
  if(!ok){ for(var i=0;i<opts.length;i++){ if(opts[i].textContent===correct) opts[i].classList.add('opt-ok'); } }
  var fb=document.getElementById('q-fb');
  fb.textContent=ok?'✓ 正解！':'✗ 正解: '+correct;
  fb.className='feedback '+(ok?'ok':'ng');
  document.getElementById('q-next').style.display='block';
  updateQuizScore();
}
function nextQuiz(){ qIdx++; showQuiz(); }
function updateQuizScore(){
  var total=qDeck.length, done=Math.min(qIdx,total);
  document.getElementById('q-total').textContent=qOk+qNg;
  document.getElementById('q-ok').textContent=qOk;
  document.getElementById('q-ng').textContent=qNg;
  document.getElementById('q-prog').textContent=done+' / '+total;
  document.getElementById('q-pct').textContent=total?Math.round(done/total*100)+'%':'0%';
  document.getElementById('q-bar').style.width=total?(done/total*100)+'%':'0%';
}
function showQuizFinish(){
  document.getElementById('q-game').style.display='none';
  document.getElementById('q-finish').style.display='block';
  var pct=(qOk+qNg)>0?Math.round(qOk/(qOk+qNg)*100):0;
  document.getElementById('q-finish-sub').textContent='正答率 '+pct+'%';
  document.getElementById('q-finish-stats').innerHTML=
    '<div class="finish-stat"><div class="n" style="color:var(--accent3)">'+qDeck.length+'</div><div class="l">総問数</div></div>'+
    '<div class="finish-stat"><div class="n" style="color:var(--success)">'+qOk+'</div><div class="l">正解</div></div>'+
    '<div class="finish-stat"><div class="n" style="color:var(--danger)">'+qNg+'</div><div class="l">不正解</div></div>';
}
function restartQuiz(weakOnly){
  if(weakOnly){ qWeak=true; document.getElementById('q-weak-btn').classList.add('active'); }
  startQuiz();
}

// ===================== WORDS =====================
function toggleWordCat(cat){
  var on=Object.keys(wCats).filter(function(k){return wCats[k];}).length;
  if(wCats[cat]&&on>1) wCats[cat]=false;
  else wCats[cat]=true;
  var btn=document.getElementById('wcb-'+cat);
  btn.className='cat-btn'+(wCats[cat]?' on-'+cat:'');
  renderWords();
}
function renderWords(){
  var body=document.getElementById('word-body');
  body.innerHTML='';
  var catNames={sf:'Salesforce',rev:'売上・利益',ops:'セールスOps',ptc:'PTC用語'};
  var count=0;
  for(var i=0;i<WORDS.length;i++){
    var w=WORDS[i];
    if(!wCats[w.cat]) continue;
    count++;
    var s=getStat(i);
    var weak=isWeak(i);
    var row=document.createElement('div');
    row.className='word-row'+(weak?' weak':'');
    row.innerHTML=
      '<span><span class="dot dot-'+w.cat+'"></span>'+w.jp+'</span>'+
      '<span style="display:flex;align-items:center;gap:5px">'+w.kr+
        ' <button class="tts-btn" style="width:24px;height:24px;font-size:12px" onclick="ttsPlay(\''+w.kr.replace(/'/g,"\\'")+'\',' + "'tts-w-"+i+"')\" id=\"tts-w-"+i+"\">🔊</button>"+
      '</span>'+
      '<span style="font-size:11px;color:var(--text3);font-family:var(--mono)">'+w.en+'</span>'+
      '<span><span class="stat-ok">✓'+s.ok+'</span> <span class="stat-ng">✗'+s.ng+'</span></span>';
    body.appendChild(row);
  }
  if(count===0) body.innerHTML='<div class="empty">該当する単語がありません</div>';
}

// ===================== PHRASES =====================
function buildPhraseCatBtns(){
  var el=document.getElementById('ph-cats');
  el.innerHTML='';
  for(var i=0;i<PCAT_ORDER.length;i++){
    var cat=PCAT_ORDER[i];
    var btn=document.createElement('button');
    btn.className='cat-btn on-sf';
    btn.textContent=PCAT_LABELS[cat];
    (function(c,b){ b.onclick=function(){
      if(phCats[c]&&Object.keys(phCats).filter(function(k){return phCats[k];}).length>1){
        phCats[c]=false; b.className='cat-btn';
      } else { phCats[c]=true; b.className='cat-btn on-sf'; }
      renderPhrases();
    }; })(cat,btn);
    el.appendChild(btn);
  }
}
function renderPhrases(){
  var q=(document.getElementById('ph-search').value||'').toLowerCase();
  var all=PHRASES.concat(userPhrases);
  var list=document.getElementById('ph-list');
  list.innerHTML='';
  for(var pi=0;pi<PCAT_ORDER.length;pi++){
    var cat=PCAT_ORDER[pi];
    if(!phCats[cat]) continue;
    var items=[];
    for(var i=0;i<all.length;i++){
      var p=all[i];
      if(p.cat!==cat) continue;
      if(q&&p.jp.toLowerCase().indexOf(q)===-1&&p.kr.indexOf(q)===-1&&p.en.toLowerCase().indexOf(q)===-1) continue;
      items.push({p:p,i:i});
    }
    if(items.length===0) continue;
    var lbl=document.createElement('div');
    lbl.className='phrase-group';
    lbl.textContent=PCAT_LABELS[cat];
    list.appendChild(lbl);
    for(var j=0;j<items.length;j++){
      var p=items[j].p;
      var globalIdx=items[j].i;
      var isUser=globalIdx>=PHRASES.length;
      var card=document.createElement('div');
      card.className='phrase-card';
      var krSafe=p.kr.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      var jpSafe=p.jp.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      var ttsId='ptts-'+globalIdx;
      card.innerHTML=
        '<div class="phrase-jp">'+p.jp+'</div>'+
        '<div class="phrase-kr">'+p.kr+'</div>'+
        '<div class="phrase-en">'+p.en+'</div>'+
        '<div class="phrase-acts">'+
          '<button class="tts-btn" id="'+ttsId+'" onclick="ttsPlay(\''+krSafe+'\',\''+ttsId+'\')">🔊</button>'+
          '<button class="copy-btn" onclick="copyText(this,\''+krSafe+'\')">📋 韓国語</button>'+
          '<button class="copy-btn" onclick="copyText(this,\''+jpSafe+'\')">📋 日本語</button>'+
          (isUser?'<button class="del-btn" onclick="delPhrase('+(globalIdx-PHRASES.length)+')">🗑</button>':'')+
        '</div>';
      list.appendChild(card);
    }
  }
  if(list.children.length===0) list.innerHTML='<div class="empty">該当するフレーズがありません</div>';
}
function copyText(btn,text){
  var orig=btn.innerHTML;
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){
      btn.innerHTML='✓ コピー完了'; btn.classList.add('copied');
      setTimeout(function(){btn.innerHTML=orig;btn.classList.remove('copied');},1500);
    });
  } else {
    var ta=document.createElement('textarea');
    ta.value=text; ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    btn.innerHTML='✓ コピー完了'; btn.classList.add('copied');
    setTimeout(function(){btn.innerHTML=orig;btn.classList.remove('copied');},1500);
  }
}
function delPhrase(idx){
  if(!confirm('削除しますか？')) return;
  userPhrases.splice(idx,1); savePhrases(); renderPhrases();
}
function selPcat(btn){
  var btns=document.querySelectorAll('.pcat-btn');
  for(var i=0;i<btns.length;i++) btns[i].classList.remove('active');
  btn.classList.add('active');
  selPcatVal=btn.getAttribute('data-pcat');
}
function addPhrase(){
  var jp=document.getElementById('add-jp').value.trim();
  var kr=document.getElementById('add-kr').value.trim();
  var en=document.getElementById('add-en').value.trim();
  var err=document.getElementById('add-err');
  if(!jp||!kr){ err.textContent='日本語と韓国語は必須です'; return; }
  err.textContent='';
  userPhrases.push({jp:jp,kr:kr,en:en,cat:selPcatVal});
  savePhrases();
  document.getElementById('add-jp').value='';
  document.getElementById('add-kr').value='';
  document.getElementById('add-en').value='';
  renderPhrases();
}

// ===================== START =====================
initTTS();
buildPhraseCatBtns();
startFlash();
startQuiz();
renderWords();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
