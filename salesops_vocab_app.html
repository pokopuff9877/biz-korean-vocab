<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>セールスオップス 韓国語単語帳</title>
<meta name="description" content="セールスオップス向け韓国語単語・フレーズ学習アプリ">
<meta name="theme-color" content="#0d0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="韓国語単語帳">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --bg2: #161922;
    --bg3: #1e2230;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #e8eaf0;
    --text2: #8b90a0;
    --text3: #555a6e;
    --accent: #4f8ef7;
    --accent2: #6ee7b7;
    --accent3: #f7c948;
    --danger: #f76f6f;
    --success: #4fd18a;
    --sf: #00a1e0;
    --rev: #4fd18a;
    --ops: #b794f4;
    --ptc: #f7a035;
    --font: 'Noto Sans JP', 'Noto Sans KR', sans-serif;
    --mono: 'DM Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg2);
  }
  .logo {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .logo span { color: var(--text2); }

  /* Nav tabs */
  .nav-tabs {
    display: flex;
    gap: 4px;
    padding: 0 24px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
  }
  .nav-tab {
    padding: 10px 16px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text2);
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .nav-tab:hover { color: var(--text); }

  /* Main */
  main { flex: 1; padding: 24px; max-width: 760px; margin: 0 auto; width: 100%; }

  /* Screen */
  .screen { display: none; }
  .screen.active { display: block; }

  /* Controls bar */
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
  }
  .ctrl-label { font-size: 12px; color: var(--text2); margin-right: 2px; }
  .ctrl-group {
    display: flex;
    gap: 4px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
  }
  .ctrl-btn {
    padding: 5px 12px;
    font-size: 12px;
    border-radius: 5px;
    border: none;
    cursor: pointer;
    background: transparent;
    color: var(--text2);
    font-family: var(--font);
    transition: all 0.15s;
  }
  .ctrl-btn.active { background: var(--accent); color: #fff; }
  .ctrl-btn:hover:not(.active) { background: var(--border); color: var(--text); }

  .cat-filter {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .cat-btn {
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--border2);
    background: transparent;
    font-size: 12px;
    cursor: pointer;
    font-family: var(--font);
    color: var(--text2);
    transition: all 0.15s;
  }
  .cat-btn.active-sf  { background: rgba(0,161,224,0.15); border-color: var(--sf); color: var(--sf); }
  .cat-btn.active-rev { background: rgba(79,209,138,0.15); border-color: var(--rev); color: var(--rev); }
  .cat-btn.active-ops { background: rgba(183,148,244,0.15); border-color: var(--ops); color: var(--ops); }
  .cat-btn.active-ptc { background: rgba(247,160,53,0.15); border-color: var(--ptc); color: var(--ptc); }
  .cat-btn:not([class*="active"]):hover { border-color: var(--border2); color: var(--text); background: var(--bg3); }

  /* Progress bar */
  .progress-wrap {
    margin-bottom: 20px;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 6px;
  }
  .progress-bar {
    height: 4px;
    background: var(--bg3);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  /* Score badges */
  .score-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .score-badge {
    flex: 1;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
  }
  .score-num { font-size: 24px; font-weight: 700; font-family: var(--mono); }
  .score-label { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .score-badge.correct .score-num { color: var(--success); }
  .score-badge.wrong .score-num { color: var(--danger); }
  .score-badge.total .score-num { color: var(--accent3); }

  /* Flashcard */
  .card-container {
    perspective: 1000px;
    width: 100%;
    height: 220px;
    margin-bottom: 20px;
    cursor: pointer;
  }
  .card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .card-inner.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 16px;
    border: 1px solid var(--border2);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    gap: 8px;
  }
  .card-front { background: var(--bg2); }
  .card-back  { background: var(--bg3); transform: rotateY(180deg); }
  .card-hint {
    position: absolute;
    top: 12px;
    right: 14px;
    font-size: 11px;
    color: var(--text3);
    font-family: var(--mono);
  }
  .card-cat {
    position: absolute;
    top: 12px;
    left: 14px;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    font-family: var(--mono);
    letter-spacing: 0.05em;
  }
  .card-cat.sf  { background: rgba(0,161,224,0.15); color: var(--sf); }
  .card-cat.rev { background: rgba(79,209,138,0.15); color: var(--rev); }
  .card-cat.ops { background: rgba(183,148,244,0.15); color: var(--ops); }
  .card-cat.ptc { background: rgba(247,160,53,0.15); color: var(--ptc); }
  .card-word {
    font-size: 28px;
    font-weight: 500;
    text-align: center;
    line-height: 1.3;
  }
  .card-sub {
    font-size: 14px;
    color: var(--text2);
    text-align: center;
  }
  .card-en {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text3);
    margin-top: 4px;
  }
  .card-actions {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }
  .btn {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    font-family: var(--font);
    cursor: pointer;
    font-weight: 500;
    transition: all 0.15s;
  }
  .btn-correct { background: rgba(79,209,138,0.15); color: var(--success); border: 1px solid rgba(79,209,138,0.3); }
  .btn-wrong   { background: rgba(247,111,111,0.12); color: var(--danger);  border: 1px solid rgba(247,111,111,0.3); }
  .btn-next    { background: var(--accent); color: #fff; border: 1px solid transparent; }
  .btn:hover { filter: brightness(1.15); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn-secondary {
    padding: 9px 18px;
    border-radius: 8px;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text2);
    font-size: 13px;
    font-family: var(--font);
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-secondary:hover { background: var(--bg3); color: var(--text); }

  /* Quiz */
  .quiz-question {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 16px;
    padding: 28px 24px;
    text-align: center;
    margin-bottom: 16px;
  }
  .quiz-q-label { font-size: 11px; color: var(--text3); font-family: var(--mono); margin-bottom: 12px; letter-spacing: 0.08em; }
  .quiz-q-word { font-size: 30px; font-weight: 500; margin-bottom: 6px; }
  .quiz-q-en { font-size: 12px; color: var(--text3); font-family: var(--mono); }
  .quiz-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .quiz-opt {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 12px;
    font-size: 15px;
    cursor: pointer;
    font-family: var(--font);
    color: var(--text);
    text-align: center;
    transition: all 0.15s;
    line-height: 1.4;
  }
  .quiz-opt:hover:not(:disabled) { border-color: var(--accent); background: rgba(79,142,247,0.08); }
  .quiz-opt.correct { background: rgba(79,209,138,0.15); border-color: var(--success); color: var(--success); }
  .quiz-opt.wrong   { background: rgba(247,111,111,0.12); border-color: var(--danger);  color: var(--danger); }
  .quiz-opt:disabled { cursor: default; }

  /* Wordlist */
  .word-list { display: flex; flex-direction: column; gap: 6px; }
  .word-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 80px;
    gap: 8px;
    align-items: center;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
  }
  .word-row.weak { border-left: 3px solid var(--danger); }
  .word-row-header {
    grid-template-columns: 1fr 1fr 1fr 80px;
    background: transparent;
    border-color: transparent;
    padding: 4px 14px;
    color: var(--text3);
    font-size: 11px;
    letter-spacing: 0.06em;
    font-family: var(--mono);
  }
  .word-row .kr { font-size: 14px; }
  .word-row .en-sm { font-size: 11px; color: var(--text3); font-family: var(--mono); }
  .stat-pill {
    display: flex;
    gap: 4px;
    font-family: var(--mono);
    font-size: 11px;
  }
  .stat-c { color: var(--success); }
  .stat-w { color: var(--danger); }
  .cat-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 3px;
    margin-right: 4px;
    vertical-align: middle;
  }
  .cat-dot.sf  { background: var(--sf); }
  .cat-dot.rev { background: var(--rev); }
  .cat-dot.ops { background: var(--ops); }
  .cat-dot.ptc { background: var(--ptc); }

  /* Feedback flash */
  .feedback {
    text-align: center;
    font-size: 14px;
    height: 20px;
    margin-bottom: 8px;
    font-weight: 500;
    transition: opacity 0.3s;
  }
  .feedback.correct { color: var(--success); }
  .feedback.wrong   { color: var(--danger); }

  /* Empty state */
  .empty { text-align: center; padding: 40px; color: var(--text2); font-size: 14px; }

  /* Finish screen */
  .finish-card {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 20px;
    padding: 40px 32px;
    text-align: center;
  }
  .finish-emoji { font-size: 48px; margin-bottom: 16px; }
  .finish-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .finish-sub { font-size: 14px; color: var(--text2); margin-bottom: 28px; }
  .finish-stats {
    display: flex;
    gap: 16px;
    margin-bottom: 28px;
    justify-content: center;
  }
  .finish-stat {
    background: var(--bg3);
    border-radius: 12px;
    padding: 16px 24px;
    min-width: 100px;
  }
  .finish-stat .n { font-size: 28px; font-weight: 700; font-family: var(--mono); }
  .finish-stat .l { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .finish-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  /* TTS button */
  .tts-btn {
    background: none;
    border: 1px solid var(--border2);
    border-radius: 50%;
    width: 34px; height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text2);
    font-size: 16px;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .tts-btn:hover { background: var(--bg3); color: var(--accent2); border-color: var(--accent2); }
  .tts-btn.speaking { color: var(--accent2); border-color: var(--accent2); background: rgba(110,231,183,0.1); animation: pulse-tts 0.8s ease-in-out infinite; }
  @keyframes pulse-tts { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .tts-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 4px; }
  .tts-label { font-size: 11px; color: var(--text3); font-family: var(--mono); }
  .word-row .tts-mini {
    width: 26px; height: 26px;
    font-size: 13px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: none;
    cursor: pointer;
    color: var(--text3);
    display: inline-flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .word-row .tts-mini:hover { color: var(--accent2); border-color: var(--accent2); }
  .tts-warn { font-size: 11px; color: var(--accent3); text-align: center; padding: 6px; display: none; }

  @media (max-width: 500px) {
    .quiz-options { grid-template-columns: 1fr; }
    .word-row { grid-template-columns: 1fr 1fr; }
    .word-row .en-sm, .word-row-header { display: none; }
    .score-num { font-size: 18px; }
  }

  /* ---- PHRASE SCREEN ---- */
  .phrase-cat-filter {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .phrase-search-wrap { margin-bottom: 16px; }
  .phrase-search {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    color: var(--text);
    font-family: var(--font);
    outline: none;
    transition: border-color 0.15s;
  }
  .phrase-search:focus { border-color: var(--accent); }
  .phrase-search::placeholder { color: var(--text3); }

  /* Phrase group heading */
  .phrase-group-label {
    font-size: 11px;
    font-family: var(--mono);
    color: var(--text3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 12px 0 6px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
  }

  /* Phrase card */
  .phrase-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 8px;
    position: relative;
  }
  .phrase-card:hover { border-color: var(--border2); }
  .phrase-jp {
    font-size: 14px;
    color: var(--text2);
    margin-bottom: 6px;
    line-height: 1.5;
  }
  .phrase-kr {
    font-size: 17px;
    color: var(--text);
    font-weight: 500;
    line-height: 1.5;
    margin-bottom: 4px;
  }
  .phrase-en {
    font-size: 12px;
    color: var(--text3);
    font-family: var(--mono);
    line-height: 1.4;
  }
  .phrase-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    align-items: center;
  }
  .phrase-copy-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    border-radius: 7px;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text2);
    font-size: 12px;
    font-family: var(--font);
    cursor: pointer;
    transition: all 0.15s;
  }
  .phrase-copy-btn:hover { background: var(--bg3); color: var(--accent2); border-color: var(--accent2); }
  .phrase-copy-btn.copied { color: var(--success); border-color: var(--success); background: rgba(79,209,138,0.08); }
  .phrase-del-btn {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--text3);
    cursor: pointer;
    font-size: 16px;
    padding: 4px 6px;
    border-radius: 6px;
    transition: all 0.15s;
    line-height: 1;
  }
  .phrase-del-btn:hover { color: var(--danger); background: rgba(247,111,111,0.1); }
  .phrase-del-btn[data-builtin] { display: none; }

  /* Add form */
  .phrase-add-card {
    background: var(--bg2);
    border: 1px dashed var(--border2);
    border-radius: 14px;
    padding: 18px 16px;
    margin-top: 20px;
  }
  .phrase-add-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--accent);
    margin-bottom: 14px;
  }
  .phrase-add-fields { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .phrase-field-group { display: flex; flex-direction: column; gap: 4px; }
  .phrase-field-label { font-size: 11px; color: var(--text3); font-family: var(--mono); }
  .phrase-input {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 14px;
    color: var(--text);
    font-family: var(--font);
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }
  .phrase-input:focus { border-color: var(--accent); }
  .phrase-input::placeholder { color: var(--text3); font-size: 13px; }
  .phrase-cat-select {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .pcat-btn {
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--border2);
    background: transparent;
    font-size: 12px;
    cursor: pointer;
    font-family: var(--font);
    color: var(--text2);
    transition: all 0.15s;
  }
  .pcat-btn.active { background: rgba(79,142,247,0.15); border-color: var(--accent); color: var(--accent); }
  .pcat-btn:hover:not(.active) { background: var(--bg3); color: var(--text); }
  .phrase-add-err { font-size: 12px; color: var(--danger); margin-top: 8px; min-height: 16px; }
</style>
</head>
<body>
<header>
  <div class="logo">Sales<span>Ops</span> 単語帳</div>
  <div style="font-size:11px;color:var(--text3);font-family:var(--mono)">JP ⇄ KR</div>
</header>

<div class="nav-tabs">
  <div class="nav-tab active" data-tab="flash">🃏 フラッシュカード</div>
  <div class="nav-tab" data-tab="quiz">🎯 4択クイズ</div>
  <div class="nav-tab" data-tab="words">📋 単語リスト</div>
  <div class="nav-tab" data-tab="phrases">💬 フレーズ集</div>
</div>

<main>

<!-- FLASHCARD -->
<div class="screen active" id="screen-flash">
  <div class="controls">
    <span class="ctrl-label">方向</span>
    <div class="ctrl-group" id="dir-group-flash">
      <button class="ctrl-btn active" data-dir="jp2kr">日→韓</button>
      <button class="ctrl-btn" data-dir="kr2jp">韓→日</button>
    </div>
    <div class="ctrl-group" id="weak-group-flash">
      <button class="ctrl-btn" data-weak="1" id="weak-btn-flash">苦手優先</button>
    </div>
  </div>
  <div class="cat-filter" id="cat-filter-flash">
    <button class="cat-btn active-sf" onclick="toggleCat('flash','sf',this)"><span class="cat-dot sf"></span>Salesforce</button>
    <button class="cat-btn active-rev" onclick="toggleCat('flash','rev',this)"><span class="cat-dot rev"></span>売上・利益</button>
    <button class="cat-btn active-ops" onclick="toggleCat('flash','ops',this)"><span class="cat-dot ops"></span>セールスOps</button>
    <button class="cat-btn active-ptc" onclick="toggleCat('flash','ptc',this)"><span class="cat-dot ptc"></span>PTC用語</button>
  </div>
  <div class="score-row">
    <div class="score-badge total"><div class="score-num" id="f-total">0</div><div class="score-label">総問数</div></div>
    <div class="score-badge correct"><div class="score-num" id="f-correct">0</div><div class="score-label">正解</div></div>
    <div class="score-badge wrong"><div class="score-num" id="f-wrong">0</div><div class="score-label">不正解</div></div>
  </div>

// stats: {correct, wrong} per word index
let stats = JSON.parse(localStorage.getItem('salesops_stats') || '{}');
function saveStats() { localStorage.setItem('salesops_stats', JSON.stringify(stats)); }
function getStats(i) { return stats[i] || {correct:0, wrong:0}; }
function addStat(i, ok) {
  if (!stats[i]) stats[i] = {correct:0, wrong:0};
  ok ? stats[i].correct++ : stats[i].wrong++;
  saveStats();
}
function isWeak(i) {
  const s = getStats(i);
  return s.wrong > s.correct && (s.correct + s.wrong) > 0;
}

// ---- State ----
let flashDir = 'jp2kr', flashWeak = false, flashCats = new Set(['sf','rev','ops','ptc']);
let quizDir  = 'jp2kr', quizWeak  = false, quizCats  = new Set(['sf','rev','ops','ptc']);

let quizDeck  = [], quizIdx  = 0;
let flashSessionC = 0, flashSessionW = 0;
let quizSessionC  = 0, quizSessionW  = 0;

// ---- Helpers ----
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function getFiltered(cats, weak, dir) {
  let pool = WORDS.map((w,i) => ({...w, idx:i})).filter(w => cats.has(w.cat));
  if (weak) {
    const weakPool = pool.filter(w => isWeak(w.idx));
    if (weakPool.length > 0) pool = weakPool;
  }
  return shuffle(pool);
}

// ---- Category toggle (hardcoded buttons) ----
function toggleCat(screen, cat, btn) {
  const catsMap = { flash: flashCats, quiz: quizCats, words: wordsCat };
  const cats = catsMap[screen];
  if (cats.has(cat)) {
    if (cats.size > 1) {
      cats.delete(cat);
      btn.className = 'cat-btn';
    }
  } else {
    cats.add(cat);
    btn.className = 'cat-btn active-' + cat;
  }
  if (screen === 'flash') { flashDeck = getFiltered(flashCats, flashWeak, flashDir); flashIdx=0; flashSessionC=0; flashSessionW=0; showFlashCard(); }
  if (screen === 'quiz')  { quizDeck  = getFiltered(quizCats,  quizWeak,  quizDir);  quizIdx=0;  quizSessionC=0;  quizSessionW=0;  showQuiz(); }
  if (screen === 'words') renderWordList();
}

function togglePhraseCat(cat, btn) {
  if (phraseFilterCat.has(cat)) {
    if (phraseFilterCat.size > 1) {
      phraseFilterCat.delete(cat);
      btn.className = 'cat-btn';
    }
  } else {
    phraseFilterCat.add(cat);
    btn.className = 'cat-btn active-sf';

}

// ---- Category filter UI (kept for compatibility) ----
function buildCatFilter(containerId, activeCats, onChange) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  ['sf','rev','ops','ptc'].forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn ' + (activeCats.has(cat) ? 'active-'+cat : '');
    btn.innerHTML = `<span class="cat-dot ${cat}"></span>${CAT_LABELS[cat]}`;
    btn.onclick = () => {
      if (activeCats.has(cat)) {
        if (activeCats.size > 1) activeCats.delete(cat);
      } else {
        activeCats.add(cat);
      }
      buildCatFilter(containerId, activeCats, onChange);
      onChange();
    };
    el.appendChild(btn);
  });
}

function initFlash() {
  bindDirBtns('dir-group-flash', dir => { flashDir = dir; flashDeck = getFiltered(flashCats,flashWeak,flashDir); flashIdx=0; flashSessionC=0; flashSessionW=0; showFlashCard(); });
  document.getElementById('weak-btn-flash').onclick = function() {
    flashWeak = !flashWeak;
    this.classList.toggle('active', flashWeak);
    flashDeck = getFiltered(flashCats, flashWeak, flashDir);
    flashIdx=0; flashSessionC=0; flashSessionW=0;
    showFlashCard();
  };
  flashDeck = getFiltered(flashCats, flashWeak, flashDir);
  flashIdx = 0; flashSessionC = 0; flashSessionW = 0;
  showFlashCard();
}

function showFlashCard() {
  document.getElementById('flash-game').style.display = 'block';
  document.getElementById('flash-finish').style.display = 'none';
  updateFlashProgress();
  if (flashDeck.length === 0) {
    document.getElementById('fc-cat').textContent = '';
    document.getElementById('fc-front-word').textContent = 'カテゴリを選んでください';
    document.getElementById('fc-front-en').textContent = '';
    document.getElementById('fc-front-tts').style.display = 'none';
    document.getElementById('fc-back-word').textContent = '';
    document.getElementById('fc-back-sub').textContent = '';
    document.getElementById('fc-back-en').textContent = '';
    document.getElementById('card-inner').classList.remove('flipped');
    document.getElementById('f-judge-btns').style.display = 'none';
    document.getElementById('f-next-btn').style.display = 'none';
    document.getElementById('f-feedback').textContent = '';
    return;
  }
  if (flashIdx >= flashDeck.length) { showFlashFinish(); return; }
  const w = flashDeck[flashIdx];
  flashFlipped = false; flashAnswered = false;
  document.getElementById('card-inner').classList.remove('flipped');
  document.getElementById('f-feedback').textContent = '';
  document.getElementById('f-feedback').className = 'feedback';

  const catEl = document.getElementById('fc-cat');
  catEl.textContent = CAT_LABELS[w.cat];
  catEl.className = 'card-cat ' + w.cat;

  if (flashDir === 'jp2kr') {
    document.getElementById('fc-front-word').textContent = w.jp;
    document.getElementById('fc-front-en').textContent = w.en;
    document.getElementById('fc-back-word').textContent = w.kr;
    document.getElementById('fc-back-sub').textContent = w.jp;
    document.getElementById('fc-back-en').textContent = w.en;
  } else {
    document.getElementById('fc-front-word').textContent = w.kr;
    document.getElementById('fc-front-en').textContent = w.en;
    document.getElementById('fc-back-word').textContent = w.jp;
    document.getElementById('fc-back-sub').textContent = w.kr;
    document.getElementById('fc-back-en').textContent = w.en;
  }
  document.getElementById('f-judge-btns').style.display = 'none';
  document.getElementById('f-next-btn').style.display = 'none';
  updateFlashTTSLabels();
  // Auto-speak when front is KR
  if (flashDir === 'kr2jp' && ttsSupported) {
    setTimeout(() => speakKr(w.kr, 'tts-front-btn'), 300);
  }
}

function flipCard() {
  if (flashAnswered) return;
  flashFlipped = !flashFlipped;
  document.getElementById('card-inner').classList.toggle('flipped', flashFlipped);
  if (flashFlipped) {
    document.getElementById('f-judge-btns').style.display = 'flex';
    // Auto-speak KR when revealed
    if (ttsSupported && flashDeck[flashIdx]) {
      setTimeout(() => speakKr(flashDeck[flashIdx].kr, 'tts-back-btn'), 300);
    }
  }
}

function judgeCard(ok) {
  flashAnswered = true;
  const w = flashDeck[flashIdx];
  addStat(w.idx, ok);
  if (ok) { flashSessionC++; } else { flashSessionW++; }
  const fb = document.getElementById('f-feedback');
  fb.textContent = ok ? '✓ 正解！' : '✗ 不正解';
  fb.className = 'feedback ' + (ok ? 'correct' : 'wrong');
  document.getElementById('f-judge-btns').style.display = 'none';
  document.getElementById('f-next-btn').style.display = 'block';
  updateFlashProgress();
  updateWordList();
}

function nextCard() {
  flashIdx++;

}

function updateFlashProgress() {
  const total = flashDeck.length;
  const done = Math.min(flashIdx, total);
  document.getElementById('f-total').textContent = flashSessionC + flashSessionW;
  document.getElementById('f-correct').textContent = flashSessionC;
  document.getElementById('f-wrong').textContent = flashSessionW;
  document.getElementById('f-prog-text').textContent = `${done} / ${total}`;
  document.getElementById('f-pct').textContent = total ? Math.round(done/total*100)+'%' : '0%';
  document.getElementById('f-prog-bar').style.width = total ? (done/total*100)+'%' : '0%';
}

function showFlashFinish() {
  document.getElementById('flash-game').style.display = 'none';

function initQuiz() {

  };
  quizDeck=getFiltered(quizCats,quizWeak,quizDir); quizIdx=0; quizSessionC=0; quizSessionW=0;
  showQuiz();
}

function getQuizOptions(w, dir) {
  const correct = dir==='jp2kr' ? w.kr : w.jp;
  const pool = WORDS.filter(x => x !== w).map(x => dir==='jp2kr' ? x.kr : x.jp);
  const wrong = shuffle(pool).slice(0,3);
  return shuffle([correct, ...wrong]);
}

function showQuiz() {
  document.getElementById('quiz-game').style.display='block';
  document.getElementById('quiz-finish').style.display='none';
  updateQuizProgress();
  if (quizDeck.length === 0) {
    document.getElementById('q-label').textContent = '';
    document.getElementById('q-word').textContent = 'カテゴリを選んでください';
    document.getElementById('q-en').textContent = '';
    document.getElementById('q-options').innerHTML = '';
    document.getElementById('q-next-btn').style.display='none';
    document.getElementById('q-feedback').textContent='';
    return;
  }
  if (quizIdx >= quizDeck.length) { showQuizFinish(); return; }
  const w = quizDeck[quizIdx];
  document.getElementById('q-next-btn').style.display='none';
  document.getElementById('q-feedback').textContent='';
  document.getElementById('q-feedback').className='feedback';

  if (quizDir==='jp2kr') {
    document.getElementById('q-label').textContent = '日本語 → 韓国語';
    document.getElementById('q-word').textContent = w.jp;
  } else {
    document.getElementById('q-label').textContent = '韓国語 → 日本語';
    document.getElementById('q-word').textContent = w.kr;
  }
  document.getElementById('q-en').textContent = w.en;
  updateQuizTTSLabel();
  // Auto-speak when question is KR
  if (quizDir === 'kr2jp' && ttsSupported) {
    setTimeout(() => speakKr(w.kr, 'tts-quiz-btn'), 300);
  }

  const opts = getQuizOptions(w, quizDir);
  const correct = quizDir==='jp2kr' ? w.kr : w.jp;
  const container = document.getElementById('q-options');
  container.innerHTML = '';
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className='quiz-opt';
    btn.textContent=opt;
    btn.onclick = () => answerQuiz(btn, opt, correct, w.idx);
    container.appendChild(btn);
  });
}

function answerQuiz(btn, chosen, correct, wordIdx) {
  document.querySelectorAll('.quiz-opt').forEach(b => b.disabled=true);
  const ok = chosen===correct;
  addStat(wordIdx, ok);
  if (ok) quizSessionC++; else quizSessionW++;
  btn.classList.add(ok ? 'correct' : 'wrong');
  if (!ok) {
    document.querySelectorAll('.quiz-opt').forEach(b => { if(b.textContent===correct) b.classList.add('correct'); });
  }
  const fb = document.getElementById('q-feedback');
  fb.textContent = ok ? '✓ 正解！' : `✗ 正解: ${correct}`;
  fb.className = 'feedback ' + (ok ? 'correct' : 'wrong');
  document.getElementById('q-next-btn').style.display='block';
  updateQuizProgress();
  updateWordList();
}

// ---- TTS ----
let krVoice = null;
let ttsSupported = false;
let currentKrText = '';
let currentKrTextQuiz = '';

function initTTS() {
  if (!window.speechSynthesis) return;
  ttsSupported = true;
  function loadVoices() {
    const voices = speechSynthesis.getVoices();
    krVoice = voices.find(v => v.lang === 'ko-KR') ||
              voices.find(v => v.lang.startsWith('ko')) ||
              null;
  }
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function speakKr(text, btnId) {
  if (!ttsSupported) return;
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ko-KR';
  utter.rate = 0.85;
  utter.pitch = 1;
  if (krVoice) utter.voice = krVoice;
  const btn = document.getElementById(btnId);
  if (btn) btn.classList.add('speaking');
  utter.onend = () => { if (btn) btn.classList.remove('speaking'); };
  utter.onerror = () => { if (btn) btn.classList.remove('speaking'); };
  speechSynthesis.speak(utter);
}

function ttsFront() {
  // front card shows KR when dir=kr2jp, JP when dir=jp2kr
  // We always want to speak KR
  if (!flashDeck[flashIdx]) return;
  speakKr(flashDeck[flashIdx].kr, 'tts-front-btn');
}
function ttsBack() {
  if (!flashDeck[flashIdx]) return;
  speakKr(flashDeck[flashIdx].kr, 'tts-back-btn');
}
function ttsQuiz() {
  if (!quizDeck[quizIdx]) return;
  speakKr(quizDeck[quizIdx].kr, 'tts-quiz-btn');
}
function ttsWord(kr, btnEl) {
  if (!ttsSupported) return;
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(kr);
  utter.lang = 'ko-KR'; utter.rate = 0.85;
  if (krVoice) utter.voice = krVoice;
  btnEl.classList.add('speaking');
  utter.onend = () => btnEl.classList.remove('speaking');
  utter.onerror = () => btnEl.classList.remove('speaking');
  speechSynthesis.speak(utter);
}

  allBtn.style.background = phraseFilterCat.size === PHRASE_CAT_ORDER.length ? 'rgba(79,142,247,0.15)' : '';
  allBtn.textContent = 'すべて';
  allBtn.onclick = () => { phraseFilterCat = new Set(PHRASE_CAT_ORDER); buildPhraseCatFilter(); renderPhrases(); };
  el.appendChild(allBtn);

  PHRASE_CAT_ORDER.forEach(cat => {
    const btn = document.createElement('button');
    const active = phraseFilterCat.has(cat) && phraseFilterCat.size < PHRASE_CAT_ORDER.length;
    btn.className = 'cat-btn';
    if (active) { btn.style.cssText = 'background:rgba(79,142,247,0.15);border-color:var(--accent);color:var(--accent)'; }
    btn.textContent = PHRASE_CAT_LABELS[cat];
    btn.onclick = () => {
      phraseFilterCat = new Set([cat]);
      buildPhraseCatFilter();
      renderPhrases();
    };
    el.appendChild(btn);
  });
}

function renderPhrases() {
  const query = (document.getElementById('phrase-search')?.value || '').toLowerCase();
  const list = document.getElementById('phrase-list');
  list.innerHTML = '';

  PHRASE_CAT_ORDER.forEach(cat => {
    if (!phraseFilterCat.has(cat)) return;
    const phrases = allPhrases().filter(p => p.cat === cat && (
      !query || p.jp.toLowerCase().includes(query) || p.kr.includes(query) || p.en.toLowerCase().includes(query)
    ));
    if (phrases.length === 0) return;

    const label = document.createElement('div');
    label.className = 'phrase-group-label';
    label.textContent = PHRASE_CAT_LABELS[cat];
    list.appendChild(label);

    phrases.forEach((p, localIdx) => {
      const globalIdx = allPhrases().indexOf(p);
      const card = document.createElement('div');
      card.className = 'phrase-card';
      card.innerHTML = `
        <div class="phrase-jp">${p.jp}</div>
        <div class="phrase-kr">${p.kr}</div>
        <div class="phrase-en">${p.en}</div>
        <div class="phrase-actions">
          <button class="tts-btn" style="width:30px;height:30px;font-size:14px" onclick="speakKr('${p.kr.replace(/'/g,"\\'")}', 'ptts-${globalIdx}')" id="ptts-${globalIdx}" title="発音を聞く">🔊</button>
          <button class="phrase-copy-btn" onclick="copyPhrase(this, '${p.kr.replace(/'/g,"\\'")}')">📋 韓国語をコピー</button>
          <button class="phrase-copy-btn" onclick="copyPhrase(this, '${p.jp.replace(/'/g,"\\'")}')">📋 日本語をコピー</button>
          ${!p.builtin ? `<button class="phrase-del-btn" onclick="deletePhrase(${userPhrases.indexOf(p)})" title="削除">🗑</button>` : ''}
        </div>
      `;
      list.appendChild(card);
    });
  });

  if (list.children.length === 0) {
    list.innerHTML = '<div class="empty">該当するフレーズがありません</div>';
  }
}

function copyPhrase(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.innerHTML;
    btn.innerHTML = '✓ コピー完了';
    btn.classList.add('copied');
    setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('copied'); }, 1500);
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    const orig = btn.innerHTML;
    btn.innerHTML = '✓ コピー完了'; btn.classList.add('copied');
    setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('copied'); }, 1500);
  });
}

function deletePhrase(idx) {
  if (!confirm('このフレーズを削除しますか？')) return;
  userPhrases.splice(idx, 1);
  saveUserPhrases();
  renderPhrases();
}

function addPhrase() {
  const jp = document.getElementById('add-jp').value.trim();
  const kr = document.getElementById('add-kr').value.trim();
  const en = document.getElementById('add-en').value.trim();
  const err = document.getElementById('phrase-add-err');
  if (!jp || !kr) { err.textContent = '日本語と韓国語は必須です'; return; }
  err.textContent = '';
  userPhrases.push({ jp, kr, en, cat: selectedPcat, builtin: false });
  saveUserPhrases();
  document.getElementById('add-jp').value = '';
  document.getElementById('add-kr').value = '';
  document.getElementById('add-en').value = '';
  renderPhrases();
  // scroll to new phrase area
  document.getElementById('phrase-list').lastElementChild?.scrollIntoView({ behavior: 'smooth' });
}

// Category select buttons handled in initApp

// ---- INIT ----
function initApp() {
  initTTS();
  renderWordList();
  renderPhrases();
  initFlash();
  initQuiz();
  document.querySelectorAll('.pcat-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.pcat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedPcat = btn.dataset.pcat;
    };
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}

// ---- PWA: Service Worker 登録 ----
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
